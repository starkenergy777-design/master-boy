<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MASTER_BOY — ხელოსნების პლატფორმა</title>
    <meta name="description" content="MASTER_BOY platform with trusted backend API v1.2.0 and native Android client experience for craftsmen and clients." />
    
    <!-- PWA / Android WebAPK Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MASTER_BOY" />
    <link rel="icon" type="image/jpeg" href="/icons/icon-192.jpg" />
    <link rel="apple-touch-icon" type="image/jpeg" href="/icons/icon-192.jpg" />

    <!-- Open Graph -->
    <meta property="og:title" content="MASTER_BOY — ხელოსნების პლატფორმა" />
    <meta property="og:description" content="MASTER_BOY platform with trusted backend API v1.2.0 and native Android client experience for craftsmen and clients." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('SW registration skipped:', err);
          });
        });
      }
    </script>
  </head>
  <body style="margin: 0; padding: 0; background-color: #020617; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow-x: hidden;">
    <div id="root">
      <div class="mb-initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; text-align: center; padding: 20px;">
        <div style="width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #f59e0b, #d97706); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4); margin-bottom: 20px; animation: pulse 2s infinite;">
          <span style="font-size: 32px; font-weight: 900; color: #020617;">MB</span>
        </div>
        <h1 style="font-size: 22px; font-weight: 800; margin: 0 0 8px 0; letter-spacing: -0.5px;">MASTER_BOY</h1>
        <p style="font-size: 14px; color: #94a3b8; margin: 0 0 24px 0;">ხელოსნების სანდო პლატფორმა</p>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cbd5e1;">
          <div style="width: 16px; height: 16px; border: 2px solid #f59e0b; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
          <span>იტვირთება სისტემა...</span>
        </div>
        <div id="mb-connection-notice" style="display: none; margin-top: 24px; padding: 16px; border-radius: 12px; background: #0f172a; border: 1px solid #334155; max-width: 340px; font-size: 13px; color: #94a3b8;">
          <p style="margin: 0 0 10px 0; color: #f8fafc; font-weight: 600;">სერვერთან კავშირი შეფერხდა</p>
          <p style="margin: 0 0 14px 0; font-size: 12px; line-height: 1.4;">სერვერთან დაკავშირება დროებით შეფერხდა. გთხოვთ დააჭიროთ განახლებას ან შეამოწმოთ ინტერნეტის კავშირი.</p>
          <button onclick="window.location.reload()" style="background: #f59e0b; color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer;">განახლება</button>
        </div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
          @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        </style>
      </div>
    </div>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const root = document.getElementById('root');
          if (root && root.querySelector('.mb-initial-loader')) {
            const errBox = document.getElementById('mb-connection-notice');
            if (errBox) errBox.style.display = 'block';
          }
        }, 6000);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
