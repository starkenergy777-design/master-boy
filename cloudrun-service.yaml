apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: master-boy
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
    spec:
      containerConcurrency: 1
      containers:
        - image: IMAGE_URL
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: REQUIRE_DURABLE_STORAGE
              value: "true"
