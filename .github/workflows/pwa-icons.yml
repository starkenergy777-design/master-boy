name: Generate PWA icons on isolated branch

on:
  push:
    branches:
      - codex/pwa-installability-safe
    paths:
      - '.github/workflows/pwa-icons.yml'
      - 'public/manifest.json'
      - 'public/icons/icon-192.jpg'
      - 'public/icons/icon-512.jpg'
      - 'public/icons/icon-maskable.jpg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install 'Pillow==11.3.0'
      - name: Resize existing brand images without changing originals
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root = Path('public/icons')
          for source, target, size in [
              ('icon-192.jpg', 'pwa-192.png', 192),
              ('icon-512.jpg', 'pwa-512.png', 512),
              ('icon-maskable.jpg', 'pwa-maskable-512.png', 512),
          ]:
              with Image.open(root / source) as img:
                  if img.width != img.height:
                      raise ValueError(f'{source} is not square')
                  if target.startswith('pwa-maskable'):
                      # Keep the original mark within Android's central safe zone.
                      canvas = Image.new('RGBA', (size, size), '#020617')
                      safe = int(size * 0.68)
                      mark = img.convert('RGBA').resize((safe, safe), Image.Resampling.LANCZOS)
                      canvas.alpha_composite(mark, ((size - safe) // 2, (size - safe) // 2))
                      canvas.save(root / target, optimize=True)
                  else:
                      img.convert('RGBA').resize((size, size), Image.Resampling.LANCZOS).save(root / target, optimize=True)
          PY
      - name: Validate generated icon dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name, size in [('pwa-192.png', 192), ('pwa-512.png', 512), ('pwa-maskable-512.png', 512)]:
              with Image.open(Path('public/icons') / name) as img:
                  assert img.size == (size, size), (name, img.size)
          PY
      - name: Commit only generated PWA icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/icons/pwa-192.png public/icons/pwa-512.png public/icons/pwa-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'Generate correctly sized PWA icons [skip ci]'
            git push
          fi
